name: Store CodeRabbit summary in PR body

# Fires whenever CodeRabbit creates or updates its walkthrough comment on a PR.
# Extracts the high-level summary from the walkthrough and stores it in the PR
# body inside HTML comment markers. The enrich-changelog workflow later picks
# these up when release-please creates a release PR.
#
# REQUIREMENT: The PR title must use a conventional commit prefix (feat:, fix:,
# etc.) so release-please can parse the squash commit and trigger a release.

on:
  issue_comment:
    types: [created, edited]

permissions:
  pull-requests: write

jobs:
  inject-summary:
    if: |
      github.event.issue.pull_request != null &&
      github.event.comment.user.id == 136622811 &&
      github.event.comment.user.login == 'coderabbitai[bot]' &&
      contains(github.event.comment.body, 'auto-generated comment: summarize by coderabbit.ai')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const comment = context.payload.comment.body;
            const prNumber = context.payload.issue.number;

            // CodeRabbit wraps its release-note summary (formatted by the
            // high_level_summary_instructions in .coderabbit.yaml) in these
            // markers. Anchor on them — the surrounding heading levels have
            // changed before and broke this workflow silently.
            const summaryMatch = comment.match(
              /<!-- This is an auto-generated comment: release notes by coderabbit\.ai -->([\s\S]*?)<!-- end of auto-generated comment: release notes by coderabbit\.ai -->/
            );

            if (!summaryMatch || !summaryMatch[1].trim()) {
              console.log('No release notes block found — skipping.');
              return;
            }

            const summary = summaryMatch[1].trim();
            const marker = [
              '<!-- coderabbit-summary-start -->',
              summary,
              '<!-- coderabbit-summary-end -->',
            ].join('\n');

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            const currentBody = pr.body ?? '';
            const markerRegex = /<!-- coderabbit-summary-start -->[\s\S]*?<!-- coderabbit-summary-end -->/;

            const newBody = markerRegex.test(currentBody)
              ? currentBody.replace(markerRegex, marker)
              : (currentBody ? `${currentBody}\n\n${marker}` : marker);

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              body: newBody,
            });

            console.log(`✅ PR #${prNumber} updated with CodeRabbit summary.`);
            console.log('Content:\n' + summary);
