name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release

      # Enrich changelog with CodeRabbit summaries when a release PR is created/updated
      - name: Enrich changelog
        if: ${{ steps.release.outputs.pr && !steps.release.outputs.release_created }}
        uses: actions/checkout@v6
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
          fetch-depth: 0

      - name: Replace changelog entries with CodeRabbit summaries
        if: ${{ steps.release.outputs.pr && !steps.release.outputs.release_created }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const changelogPath = 'CHANGELOG.md';
            let changelog = fs.readFileSync(changelogPath, 'utf-8');

            // Split changelog into sections by version headings
            const sections = changelog.split(/(?=^## \[)/m);
            const latestSection = sections.find(s => /^## \[\d+\.\d+\.\d+\]/.test(s));

            if (!latestSection) {
              console.log('No version section found in changelog — skipping.');
              return;
            }

            const headingEnd = latestSection.indexOf('\n') + 1;
            const versionHeading = latestSection.slice(0, headingEnd);
            const existingContent = latestSection.slice(headingEnd);

            console.log('Version heading:', versionHeading.trim());
            console.log('Content length:', existingContent.length);

            const prNumbers = [...existingContent.matchAll(/\[#(\d+)\]/g)]
              .map(m => parseInt(m[1], 10))
              .filter((n, i, arr) => arr.indexOf(n) === i);

            if (prNumbers.length === 0) {
              console.log('No PR references found in changelog — skipping.');
              return;
            }

            console.log(`Found PR references: ${prNumbers.join(', ')}`);

            const summaries = [];
            for (const prNum of prNumbers) {
              try {
                const { data: mergedPr } = await github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: prNum,
                });

                const body = mergedPr.body ?? '';
                const summaryMatch = body.match(
                  /<!-- coderabbit-summary-start -->\r?\n([\s\S]*?)\r?\n<!-- coderabbit-summary-end -->/
                );

                if (summaryMatch && summaryMatch[1].trim()) {
                  summaries.push({
                    pr: prNum,
                    title: mergedPr.title,
                    summary: summaryMatch[1].trim(),
                  });
                  console.log(`✅ PR #${prNum}: found CodeRabbit summary`);
                } else {
                  console.log(`⏭️ PR #${prNum}: no CodeRabbit summary found`);
                }
              } catch (err) {
                console.log(`⚠️ PR #${prNum}: failed to fetch — ${err.message}`);
              }
            }

            if (summaries.length === 0) {
              console.log('No CodeRabbit summaries found — keeping default changelog.');
              return;
            }

            let enriched = '\n';
            if (summaries.length === 1) {
              enriched += summaries[0].summary + '\n';
            } else {
              for (const s of summaries) {
                enriched += `### ${s.title} ([#${s.pr}](https://github.com/${context.repo.owner}/${context.repo.repo}/pull/${s.pr}))\n\n`;
                enriched += s.summary + '\n\n';
              }
            }

            const replacement = versionHeading + enriched;
            changelog = changelog.replace(latestSection, replacement);

            fs.writeFileSync(changelogPath, changelog);
            console.log('📝 Changelog enriched with CodeRabbit summaries.');

      - name: Push enriched changelog
        if: ${{ steps.release.outputs.pr && !steps.release.outputs.release_created }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "docs: enrich changelog with CodeRabbit summaries"
          git push

      # Publish to npm when a release is created
      - name: Checkout
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/checkout@v6

      - name: Setup Node.js
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Install dependencies
        if: ${{ steps.release.outputs.release_created }}
        run: npm i --no-audit --no-fund

      - name: Prepare Nuxt
        if: ${{ steps.release.outputs.release_created }}
        run: npx nuxi prepare

      - name: Run tests
        if: ${{ steps.release.outputs.release_created }}
        run: npm run test:unit

      - name: Publish to npm
        if: ${{ steps.release.outputs.release_created }}
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
