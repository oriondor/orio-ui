name: Enrich release changelog with CodeRabbit summaries

# Triggers when release-please creates or updates its release PR.
# Replaces the default changelog entries (plain commit titles) with
# the rich CodeRabbit summaries stored in each merged PR's body.

on:
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: changelog-release-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  enrich:
    # Only run on release-please PRs
    if: contains(github.event.pull_request.labels.*.name, 'autorelease: pending')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const pr = context.payload.pull_request;

            // Read the changelog from the branch
            const changelogPath = 'CHANGELOG.md';
            let changelog = fs.readFileSync(changelogPath, 'utf-8');

            // Find the latest version section that release-please just added.
            // It's the first ## heading after the file header.
            const versionMatch = changelog.match(
              /^(## \[\d+\.\d+\.\d+\].*?\n)([\s\S]*?)(?=\n## \[|$)/m
            );

            if (!versionMatch) {
              console.log('No version section found in changelog — skipping.');
              return;
            }

            const versionHeading = versionMatch[1];
            const existingContent = versionMatch[2];

            // Extract PR numbers from the existing changelog content.
            // Release-please includes them as (#123) links.
            const prNumbers = [...existingContent.matchAll(/#(\d+)/g)]
              .map(m => parseInt(m[1], 10))
              .filter((n, i, arr) => arr.indexOf(n) === i);

            if (prNumbers.length === 0) {
              console.log('No PR references found in changelog — skipping.');
              return;
            }

            console.log(`Found PR references: ${prNumbers.join(', ')}`);

            // Fetch CodeRabbit summaries from each referenced PR
            const summaries = [];
            for (const prNum of prNumbers) {
              try {
                const { data: mergedPr } = await github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: prNum,
                });

                const body = mergedPr.body ?? '';
                const summaryMatch = body.match(
                  /<!-- coderabbit-summary-start -->\n([\s\S]*?)\n<!-- coderabbit-summary-end -->/
                );

                if (summaryMatch && summaryMatch[1].trim()) {
                  summaries.push({
                    pr: prNum,
                    title: mergedPr.title,
                    summary: summaryMatch[1].trim(),
                  });
                  console.log(`✅ PR #${prNum}: found CodeRabbit summary`);
                } else {
                  console.log(`⏭️ PR #${prNum}: no CodeRabbit summary found`);
                }
              } catch (err) {
                console.log(`⚠️ PR #${prNum}: failed to fetch — ${err.message}`);
              }
            }

            if (summaries.length === 0) {
              console.log('No CodeRabbit summaries found — keeping default changelog.');
              return;
            }

            // Build the enriched changelog section.
            // If there's one PR, use its summary directly.
            // If multiple, include each under the PR title as a heading.
            let enriched = '\n';
            if (summaries.length === 1) {
              enriched += summaries[0].summary + '\n';
            } else {
              for (const s of summaries) {
                enriched += `### ${s.title} ([#${s.pr}](https://github.com/${context.repo.owner}/${context.repo.repo}/pull/${s.pr}))\n\n`;
                enriched += s.summary + '\n\n';
              }
            }

            // Replace the version section content
            const fullMatch = versionHeading + existingContent;
            const replacement = versionHeading + enriched;
            changelog = changelog.replace(fullMatch, replacement);

            fs.writeFileSync(changelogPath, changelog);
            console.log('📝 Changelog enriched with CodeRabbit summaries.');

      - name: Commit updated changelog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "docs: enrich changelog with CodeRabbit summaries"
          git push
