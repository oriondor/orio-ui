reviews:
  # Keep the high-level summary in the walkthrough comment (not the PR body),
  # so the BEGIN_COMMIT_OVERRIDE block we inject stays clean.
  high_level_summary: true
  high_level_summary_in_walkthrough: true
  high_level_summary_instructions: |
    Write the summary as 1–3 conventional commit messages, one per line, using this exact format:
      feat(scope): description
      fix: description
    Rules:
    - Only use types: feat, fix, chore, docs, refactor, perf, test
    - Scope is optional; use it when the change is clearly scoped to one component or area (e.g. carousel, button, input)
    - Each line must start with a valid type and colon — no bullet points, no markdown, no other text
    - Keep each line under 100 characters
    - Do not include a scope if changes are wide/cross-cutting
